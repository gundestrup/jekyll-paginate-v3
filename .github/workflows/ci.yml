name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

permissions:
  contents: read

jobs:
  markdownlint:
    name: Markdown lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Lint Markdown
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34 # v25.0.0
        with:
          config: .markdownlint-cli2.jsonc
          globs: |
            AGENTS.md
            [Cc][Hh][Aa][Nn][Gg][Ee][Ll][Oo][Gg].md
            CLAUDE.md
            CONTRIBUTING.md
            DEVIN.md
            DOCUMENTATION.md
            [Rr][Ee][Aa][Dd][Mm][Ee].md
            README.Development.md
            README.developer.md
            README.performance.md
            README.devel*.md
            RELEASE.md
            SECURITY.md
            STYLING.md
            TESTING.md
            WINDSURF.md
            .devin/*.md
            .github/**/*.md

  test:
    name: RSpec + coverage (Jekyll ${{ matrix.jekyll-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # codecov tokenless OIDC upload
    strategy:
      fail-fast: false
      matrix:
        # Jekyll 3.8.x cannot be tested: it requires kramdown ~> 1.14,
        # which conflicts with kramdown-parser-gfm (~> 2.0).
        jekyll-version: ['~> 3.9.0', '~> 4.0']
    env:
      JEKYLL_VERSION: ${{ matrix.jekyll-version }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true
          ruby-version: .ruby-version

      - name: Run specs
        run: bundle exec rspec
        env:
          CI: "true"

      - name: Upload coverage to Codecov
        if: matrix.jekyll-version == '~> 4.0'
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: ./coverage/coverage.xml
          disable_search: true
          use_oidc: true
          fail_ci_if_error: false

      - name: SonarQube Cloud scan
        if: matrix.jekyll-version == '~> 4.0'
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

  lint:
    name: RuboCop
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true
          ruby-version: .ruby-version

      - name: Lint
        run: bundle exec rubocop

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Community-edition scan against repo-local rules — no Semgrep
      # account, no telemetry, source never leaves the runner.
      # Scan the repo root: semgrep limits itself to git-tracked files, and
      # naming explicit dirs silently breaks CI if one is ever removed.
      - name: Semgrep scan
        run: pipx run semgrep scan --config .semgrep.yml --oss-only --metrics off --disable-version-check --error .

  audit:
    name: bundler-audit
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          bundler-cache: true
          ruby-version: .ruby-version

      - name: Audit dependencies
        run: bundle exec bundle-audit check --update
