# SonarQube Cloud configuration (CI-based analysis via GitHub Actions).
# Keep exclusion boundaries in sync with codecov.yml ignore: and
# .codefactor.yml exclude:.
sonar.organization=gundestrup
sonar.projectKey=gundestrup_jekyll-paginate-v3
sonar.projectName=jekyll-paginate-v3

sonar.sources=lib
sonar.tests=spec
sonar.exclusions=docs/**
sonar.test.exclusions=spec/**

# SimpleCov JSON report emitted by spec/spec_helper.rb in CI
sonar.ruby.coverage.reportPaths=coverage/coverage.json
