inherit_from: .rubocop_todo.yml

# Style mirrors upstream ConvincibleMedia conventions so merges stay clean:
# tabs, single quotes (RuboCop default), long lines tolerated.
AllCops:
  TargetRubyVersion: 3.4
  NewCops: disable
  SuggestExtensions: false
  Exclude:
    - 'pkg/**/*'
    - 'vendor/**/*'

Layout/IndentationStyle:
  EnforcedStyle: tabs

Layout/LineLength:
  Max: 160

# The entry file is named after the gem, not the module it defines.
Naming/FileName:
  Exclude:
    - 'lib/jekyll-paginate-v3.rb'

# Specs intentionally define stub constants inside RSpec.describe blocks.
Lint/ConstantDefinitionInBlock:
  Exclude:
    - 'spec/**/*'

# These subclasses re-initialise Jekyll objects fully (the same pattern as
# Jekyll's own PageWithoutAFile) — calling super has no state to reuse.
Lint/MissingSuper:
  Exclude:
    - 'lib/jekyll-paginate-v3/pagination/pages/**/*.rb'
    - 'lib/jekyll-paginate-v3/pagination/paginator/**/*.rb'
    - 'lib/jekyll-paginate-v3/templates/**/*.rb'

Metrics/BlockLength:
  Exclude:
    - 'spec/**/*'
    - 'Rakefile'
    - '*.gemspec'
